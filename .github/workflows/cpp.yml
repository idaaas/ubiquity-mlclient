name: Cpp Build And Publish

on:
    workflow_call:
      inputs:
        release:
          description: "is a release built ? (true/false)"
          required: true
          type: string
      secrets:
        earthly_token:
          required: true
        earthly_satellite:
          required: true
        earthly_org:
          required: true
  

jobs:
    build-ubuntu-xenial:
        runs-on: ubuntu-latest
        env:
          EARTHLY_TOKEN: ${{ secrets.earthly_token }}
        permissions:
            contents: read
            packages: write
        steps:
        - uses: earthly/actions-setup@v1
          with:
            version: v0.8.15
        - uses: actions/checkout@v4
          with:
            ref: ${{ github.ref }}
        - name: Ubuntu 16.04
          run: earthly --push --sat ${{ secrets.earthly_satellite }} --org ${{ secrets.earthly_org }} +build --lang=cpp --os=ubuntu:16.04
        - name: Upload artifact
          uses: actions/upload-artifact@v4
          with:
            name: ubiquity-mlclient-ubuntu-16.04
            path: local-output/cpp/ubuntu:16.04
    
    build-ubuntu-focal:
        runs-on: ubuntu-latest
