name: Cpp Build And Publish

on:
    workflow_call:
      inputs:
        release:
          description: "is a release built ? (true/false)"
          required: true
          type: string
      secrets:
        dockerhub_username:
          required: true
        dockerhub_token:
          required: true
  

jobs:
    build-ubuntu-xenial:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
        - uses: earthly/actions-setup@v1
          with:
            version: v0.8.15
        - uses: actions/checkout@v4
          with:
            ref: ${{ github.ref }}
        - name: Docker Login
          env:
            DOCKERHUB_USERNAME: ${{ secrets.dockerhub_username }}
            DOCKERHUB_TOKEN: ${{ secrets.dockerhub_token }}
          run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
        - name: Ubuntu 16.04
          run: earthly --push +build --lang=cpp --os=ubuntu:16.04
        - name: Upload artifact
          uses: actions/upload-artifact@v4
          with:
            name: ubiquity-mlclient-ubuntu-16.04
            path: local-output/cpp/ubuntu:16.04
    
    build-ubuntu-focal:
        runs-on: ubuntu-latest
