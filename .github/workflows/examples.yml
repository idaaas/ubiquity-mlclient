name: Examples build & publish

on:
    workflow_call:
      inputs:
        new-tag:
          description: "new version value"
          required: true
          type: string
        release:
          description: "is it a release build ? (value = true/false)"
          required: true
          type: string
        private:
          description: "is built on private repo ? (true/false)"
          required: false
          default: "false"
          type: string
      secrets:
        dockerhub_username:
          required: true
        dockerhub_token:
          required: true

jobs:
    build-docker-examples:
        runs-on: ubuntu-latest
        steps:
        - uses: earthly/actions-setup@v1
          with:
            version: v0.8.15
        - uses: actions/checkout@v4
          with:
            ref: ${{ github.ref }}
        - name: Docker Login
          env:
            DOCKERHUB_USERNAME: ${{ secrets.dockerhub_username }}
            DOCKERHUB_TOKEN: ${{ secrets.dockerhub_token }}
          run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
        - name: Populate private prefix value
          run: |
            PRIVATE_PREFIX=$(if [ "${{ inputs.private }}" = "true" ]; then echo "private-"; else echo ""; fi)
            echo "PRIVATE_PREFIX=$PRIVATE_PREFIX" >> $GITHUB_ENV
            DEV_SUFFIX=$(if [ "${{ inputs.release }}" = "true" ]; then echo ""; else echo "-dev"; fi)
            echo "DEV_SUFFIX=$DEV_SUFFIX" >> $GITHUB_ENV
        - name: Login to github registry
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        - name: Build & Push Examples
          run: earthly --push --ci +all-examples --imagePrefix=ghcr.io/idaaas/${{ env.PRIVATE_PREFIX }} --imageSuffix=${{ inputs.new-tag }}${{ env.DEV_SUFFIX }}
          if: inputs.release == 'false'
        - name: Build & Push Examples
          run: earthly --push --ci +all-examples --imagePrefix=ghcr.io/idaaas/${{ env.PRIVATE_PREFIX }} --imageSuffix=${{ inputs.new-tag }}${{ env.DEV_SUFFIX }} --latest=true
          if: inputs.release == 'true'
