name: Python Build And Publish

on:
    workflow_call:
      inputs:
        new-tag:
          description: "new version value"
          required: true
          type: string
        release:
          description: "is a release build ? (value = true/false)"
          required: true
          type: string
      secrets:
        secret_token:
          required: true
        earthly_token:
          required: true
        earthly_satellite:
          required: true
        earthly_org:
          required: true

jobs:
    build-ubuntu-xenial:
        runs-on: ubuntu-latest
        env:
          EARTHLY_TOKEN: ${{ secrets.earthly_token }}
        permissions:
            contents: read
            packages: write
        steps:
        - uses: earthly/actions-setup@v1
          with:
            version: v0.8.15
        - uses: actions/checkout@v4
          with:
            ref: ${{ github.ref }}
        - name: Ubuntu 16.04 python 1.16
          run: earthly --ci --sat ${{ secrets.earthly_satellite }} --org ${{ secrets.earthly_org }} +deploy --lang=python --os=ubuntu:16.04 --token=${{ secrets.secret_token }} --version=${{ inputs.new-tag }}
          # trigger python build only if we are tagging main
          if: inputs.release == 'true'
    
    build-ubuntu-focal:
        runs-on: ubuntu-latest
        env:
          EARTHLY_TOKEN: ${{ secrets.earthly_token }}
        steps:
        - uses: earthly/actions-setup@v1
          with:
            version: v0.8.15
        - uses: actions/checkout@v4
          with:
            ref: ${{ github.ref }}
        - name: Earthly version
          run: earthly --version
        - name: Ubuntu 20.04 python 1.16
          run: earthly --ci --sat ${{ secrets.earthly_satellite }} --org ${{ secrets.earthly_org }} +deploy --lang=python --os=ubuntu:20.04 --token=${{ secrets.secret_token }} --version=${{ inputs.new-tag }}
          if: inputs.release == 'true'

    build-ubuntu-jammy:
        runs-on: ubuntu-latest
        env:
          EARTHLY_TOKEN: ${{ secrets.earthly_token }}
        steps:
        - uses: earthly/actions-setup@v1
          with:
            version: v0.8.15
        - uses: actions/checkout@v4
          with:
            ref: ${{ github.ref }}
        - name: Earthly version
          run: earthly --version
        - name: Ubuntu 22.04 python 1.16
          run: earthly --ci --sat ${{ secrets.earthly_satellite }} --org ${{ secrets.earthly_org }} +deploy --lang=python --os=ubuntu:22.04 --token=${{ secrets.secret_token }} --version=${{ inputs.new-tag }}
          if: inputs.release == 'true'

    build-ubuntu-noble:
        runs-on: ubuntu-latest
        env:
          EARTHLY_TOKEN: ${{ secrets.earthly_token }}
        steps:
        - uses: earthly/actions-setup@v1
          with:
            version: v0.8.15
        - uses: actions/checkout@v4
          with:
            ref: ${{ github.ref }}
        - name: Earthly version
          run: earthly --version
        - name: Ubuntu 24.04 python 1.16
          run: earthly --ci --sat ${{ secrets.earthly_satellite }} --org ${{ secrets.earthly_org }} +deploy --lang=python --os=ubuntu:24.04 --token=${{ secrets.secret_token }} --version=${{ inputs.new-tag }}
          if: inputs.release == 'true'


            