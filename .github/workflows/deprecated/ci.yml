name: Earthly CI

on:
  push:
    tags:
      - '*'
    branches:
      - develop*

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      # Expose new tag for other jobs
      NEW_TAG: ${{ env.NEW_TAG }}
      SNAP: ${{ env.SNAP }}
      DEV: ${{ env.DEV }}
      PRIVATE: ${{ env.PRIVATE }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    # Get latest tag and update minor version
    - uses: actions-ecosystem/action-get-latest-tag@v1
      id: get-latest-tag
    - uses: actions-ecosystem/action-bump-semver@v1
      id: bump-semver
      with:
        current_version: ${{ steps.get-latest-tag.outputs.tag }}
        level: patch 
    - name: Setup variables
      id: setup-variables
      run: |
          if [[ "${{ github.event.repository.name }}" == "ubiquity-mlclient" ]]; then
            echo "PRIVATE=false" >> $GITHUB_ENV
          else
            echo "PRIVATE=true" >> $GITHUB_ENV
          fi
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "NEW_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
            echo "SNAP=false" >> $GITHUB_ENV
            echo "DEV=" >> $GITHUB_ENV
          else
            echo "NEW_TAG=${{ steps.bump-semver.outputs.new_version }}" >> $GITHUB_ENV
            echo "SNAP=true" >> $GITHUB_ENV
            echo "DEV=-dev" >> $GITHUB_ENV
          fi
  build-ubuntu-xenial:
    runs-on: ubuntu-latest
    needs: setup
    env:
      REPO_NAME: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEW_TAG: ${{ needs.setup.outputs.NEW_TAG }}
      SNAP: ${{ needs.setup.outputs.SNAP }}
    permissions:
      contents: read
      packages: write
    steps:
    - uses: earthly/actions-setup@v1
      with:
        version: v0.8.15
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    - name: Ubuntu 16.04 java 8
      run: earthly --ci --no-cache +java-publish --os=ubuntu:16.04 --release=8 --token=${GITHUB_TOKEN} --version=${NEW_TAG} --repo=${REPO_NAME} --snap=${SNAP}
    - name: Ubuntu 16.04 java 17
      run: earthly --ci --no-cache +java-publish --os=ubuntu:16.04 --release=17 --token=${GITHUB_TOKEN} --version=${NEW_TAG} --repo=${REPO_NAME} --snap=${SNAP}
    - name: Ubuntu 16.04 go 1.16
      run: earthly --ci +go-publish --os=ubuntu:16.04 --token=${GO_REPO_TOKEN} --version=${NEW_TAG}
      env:
        GO_REPO_TOKEN: ${{ secrets.GO_REPO_TOKEN }}
      # trigger go build only if we are tagging main
      if: env.SNAP == 'false'
  build-ubuntu-focal:
    runs-on: ubuntu-latest
    needs: setup
    env:
      REPO_NAME: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEW_TAG: ${{ needs.setup.outputs.NEW_TAG }}
      SNAP: ${{ needs.setup.outputs.SNAP }}
    steps:
    - uses: earthly/actions-setup@v1
      with:
        version: v0.8.15
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    - name: Earthly version
      run: earthly --version
    - name: Ubuntu 20.04 java 8
      run: earthly --ci --no-cache +java-publish --os=ubuntu:20.04 --release=8 --token=${GITHUB_TOKEN} --version=${NEW_TAG} --repo=${REPO_NAME} --snap=${SNAP}
    - name: Ubuntu 20.04 java 17
      run: earthly --ci --no-cache +java-publish --os=ubuntu:20.04 --release=17 --token=${GITHUB_TOKEN} --version=${NEW_TAG} --repo=${REPO_NAME} --snap=${SNAP}
    - name: Ubuntu 20.04 go 1.16
      run: earthly --ci +go-publish --os=ubuntu:20.04 --token=${GO_REPO_TOKEN} --version=${NEW_TAG}
      env:
        GO_REPO_TOKEN: ${{ secrets.GO_REPO_TOKEN }}
      if: env.SNAP == 'false'
  build-ubuntu-jammy:
    runs-on: ubuntu-latest
    needs: setup
    env:
      REPO_NAME: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEW_TAG: ${{ needs.setup.outputs.NEW_TAG }}
      SNAP: ${{ needs.setup.outputs.SNAP }}
    steps:
    - uses: earthly/actions-setup@v1
      with:
        version: v0.8.15
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    - name: Earthly version
      run: earthly --version
    - name: Ubuntu 22.04 java 8
      run: earthly --ci --no-cache +java-publish --os=ubuntu:22.04 --release=8 --token=${GITHUB_TOKEN} --version=${NEW_TAG} --repo=${REPO_NAME} --snap=${SNAP}
    - name: Ubuntu 22.04 java 17
      run: earthly --ci --no-cache +java-publish --os=ubuntu:22.04 --release=17 --token=${GITHUB_TOKEN} --version=${NEW_TAG} --repo=${REPO_NAME} --snap=${SNAP}
    - name: Ubuntu 22.04 go 1.16
      run: earthly --ci +go-publish --os=ubuntu:22.04 --token=${GO_REPO_TOKEN} --version=${NEW_TAG}
      env:
        GO_REPO_TOKEN: ${{ secrets.GO_REPO_TOKEN }}
      if: env.SNAP == 'false'
  build-ubuntu-noble:
    runs-on: ubuntu-latest
    needs: setup
    env:
      REPO_NAME: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEW_TAG: ${{ needs.setup.outputs.NEW_TAG }}
      SNAP: ${{ needs.setup.outputs.SNAP }}
    steps:
    - uses: earthly/actions-setup@v1
      with:
        version: v0.8.15
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    - name: Earthly version
      run: earthly --version
    - name: Ubuntu 24.04 java 8
      run: earthly --ci --no-cache +java-publish --os=ubuntu:24.04 --release=8 --token=${GITHUB_TOKEN} --version=${NEW_TAG} --repo=${REPO_NAME} --snap=${SNAP}
    - name: Ubuntu 24.04 java 17
      run: earthly --ci --no-cache +java-publish --os=ubuntu:24.04 --release=17 --token=${GITHUB_TOKEN} --version=${NEW_TAG} --repo=${REPO_NAME} --snap=${SNAP}
    - name: Ubuntu 24.04 go 1.16
      run: earthly --ci +go-publish --os=ubuntu:24.04 --token=${GO_REPO_TOKEN} --version=${NEW_TAG}
      env:
        GO_REPO_TOKEN: ${{ secrets.GO_REPO_TOKEN }}
      if: env.SNAP == 'false'

  build-docker-examples:
    runs-on: ubuntu-latest
    needs: setup
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEV: ${{ needs.setup.outputs.DEV }}
      NEW_TAG: ${{ needs.setup.outputs.NEW_TAG }}
      SNAP: ${{ needs.setup.outputs.SNAP }}
    steps:
    - uses: earthly/actions-setup@v1
      with:
        version: v0.8.15
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    - name: Login to github registry
      run: docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
    - name: Build & Push Examples
      run: earthly --push --ci +build-examples --os=ubuntu:24.04 --release=17 --imagePrefix=ghcr.io/idaaas/ --imageVersion=${NEW_TAG}${DEV}
      if: env.SNAP == 'true'
    - name: Build & Push Examples
      run: earthly --push --ci --strict +build-examples --os=ubuntu:24.04 --release=17 --imagePrefix=ghcr.io/idaaas/ --imageVersion=${NEW_TAG}${DEV} --latest=true
      if: env.SNAP == 'false'
