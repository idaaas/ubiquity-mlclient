            DOCKERHUB_USERNAME: ${{ secrets.dockerhub_username }}
            DOCKERHUB_TOKEN: ${{ secrets.dockerhub_token }}
          run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
        - name: Earthly version
          run: earthly --version
        - name: Ubuntu 20.04 java 8
          run: earthly --ci +deploy --lang=java --os=ubuntu:20.04 --release=8 --token=${{ secrets.GITHUB_TOKEN }} --version=${{ inputs.new-tag }} --repo=${{ inputs.repo-name }} --snap=${{ inputs.snap }} --private=${{ inputs.private }}

