name: Java 8 Build And Publish

on:
    workflow_call:
      inputs:
        repo-name:
          description: "Name of repository"
          required: true
          type: string
        new-tag:
          description: "new version value"
          required: true
          type: string
        snap:
          description: "build snapshot"
          required: true
          type: string
        private:
          description: "is built on private repo ? (true/false)"
          required: false
          default: "false"
          type: string
      secrets:
        dockerhub_username:
          required: true
        dockerhub_token:
          required: true
  

jobs:
    build-ubuntu-xenial:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
        - uses: earthly/actions-setup@v1
          with:
            version: v0.8.15
        - uses: actions/checkout@v4
          with:
            ref: ${{ github.ref }}
        - name: Docker Login
          env:
            DOCKERHUB_USERNAME: ${{ secrets.dockerhub_username }}
            DOCKERHUB_TOKEN: ${{ secrets.dockerhub_token }}
          run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
        - name: Ubuntu 16.04 java 8
          run: earthly --ci +deploy --lang=java --os=ubuntu:16.04 --release=8 --token=${{ secrets.GITHUB_TOKEN }} --version=${{ inputs.new-tag }} --repo=${{ inputs.repo-name }} --snap=${{ inputs.snap }} --private=${{ inputs.private }}
    
    build-ubuntu-focal:
        runs-on: ubuntu-latest
        steps:
        - uses: earthly/actions-setup@v1
          with:
            version: v0.8.15
        - uses: actions/checkout@v4
