      run: earthly --version
    - name: Ubuntu 22.04 java 8
      run: earthly --ci --no-cache +java-publish --os=ubuntu:22.04 --release=8 --token=${GITHUB_TOKEN} --version=${GITHUB_REF_NAME}
      env:
