version: '3'
services:
  fakeserver:
    image: openjdk:17.0.2
    container_name: fakeserver
    command: >
      bash -c "java --add-opens java.base/java.nio=ALL-UNNAMED --add-opens java.base/sun.nio.ch=ALL-UNNAMED -Dconfig.file=/build/application.json -classpath /build/integration-tests.jar ai.ubiquity.integration.tests.common.Cluster > /build/$OUTPUT"
    expose:
      - "2000-2006"
    volumes:
      - /client/build:/build
    shm_size: 1024M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      fake_server1:
        ipv4_address: 10.20.0.1
      fake_server2:
        ipv4_address: 10.20.0.5
      fake_server3:
        ipv4_address: 10.20.0.9
      fake_server4:
        ipv4_address: 10.20.0.13
    environment:
      - SCENARIO=scenario0
      - OUTPUT=it-scenario0.log
networks:
  fake_server1:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/30
          gateway: 10.20.0.2
  fake_server2:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.4/30
          gateway: 10.20.0.6
  fake_server3:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.8/30
          gateway: 10.20.0.10
  fake_server4:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.12/30
          gateway: 10.20.0.14